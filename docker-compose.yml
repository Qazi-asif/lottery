# Optional local Postgres only. Production and default local development
# use hosted Supabase (see supabase/README.md and .env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scratchcrest
    ports:
      - "5432:5432"
    volumes:
      - scratchcrest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scratchcrest"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  scratchcrest_pgdata:
